<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة متجر أحمد البلاسي</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f7f7f8;color:#171717}
.container{width:min(900px,92%);margin:auto}
header{background:#111;color:#fff;padding:20px 0;margin-bottom:25px}
h1{margin:0;font-size:25px}
.box{background:#fff;padding:22px;border-radius:16px;margin-bottom:20px;border:1px solid #eee}
input,select,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
textarea{height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer}
.add{background:#d7ff4f;color:#111;width:100%;margin-top:8px}
.product{display:flex;align-items:center;gap:15px;border-bottom:1px solid #eee;padding:12px 0}
.product:last-child{border-bottom:0}
.product img{width:75px;height:75px;object-fit:cover;border-radius:10px;background:#eee}
.details{flex:1}
.details h3{margin:0 0 5px}
.details p{margin:3px 0;color:#777}
.delete{background:#fee;color:#c22}
.message{margin-top:10px;font-weight:bold}
.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.preview img{width:70px;height:70px;object-fit:cover;border-radius:8px}
</style>
</head>

<body>

<header>
<div class="container">
<h1>🛍️ إدارة متجر أحمد البلاسي</h1>
</div>
</header>

<main class="container">

<div class="box">

<h2>➕ إضافة منتج</h2>

<form id="productForm" enctype="multipart/form-data">

<input name="name" required placeholder="اسم المنتج">

<select name="category" required>
<option value="">اختر القسم</option>
<option>إلكترونيات</option>
<option>ملابس</option>
<option>إكسسوارات</option>
</select>

<input name="price" required type="number" min="0" step="0.01" placeholder="السعر">

<input name="old" type="number" min="0" step="0.01" placeholder="السعر القديم (اختياري)">

<input name="badge" placeholder="الشارة (مثال: جديد / خصم)">

<textarea name="description" placeholder="وصف المنتج (اختياري)"></textarea>

<label>📷 صور المنتج — حتى 5 صور</label>

<input
  name="images"
  type="file"
  accept="image/*"
  multiple
  id="images"
>

<div id="preview" class="preview"></div>

<button class="add" type="submit">
نشر المنتج
</button>

<div id="message" class="message"></div>

</form>

</div>

<div class="box">

<h2>📦 المنتجات الموجودة</h2>

<div id="products">
جاري التحميل...
</div>

</div>

</main>

<script>

const imageInput = document.getElementById("images");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", function(){

  preview.innerHTML = "";

  const files = Array.from(this.files).slice(0,5);

  if(this.files.length > 5){
    alert("يمكن اختيار 5 صور كحد أقصى.");
  }

  files.forEach(file => {

    const img = document.createElement("img");

    img.src = URL.createObjectURL(file);

    preview.appendChild(img);

  });

});

async function loadProducts(){

  const box = document.getElementById("products");

  try{

    const res = await fetch("/api/products");

    const products = await res.json();

    if(!products.length){

      box.innerHTML = "لا توجد منتجات مضافة حتى الآن.";

      return;
    }

    box.innerHTML = products.map(p => {

      const images = Array.isArray(p.images)
        ? p.images
        : (p.img ? [p.img] : []);

      const firstImage = images[0] || "";

      return `

      <div class="product">

        ${
          firstImage
          ? `<img src="${firstImage}" alt="">`
          : `<div style="width:75px;height:75px;background:#eee;border-radius:10px"></div>`
        }

        <div class="details">

          <h3>${escapeHtml(p.name)}</h3>

          <p>
          ${escapeHtml(p.category)}
          —
          ${Number(p.price).toLocaleString("ar-EG")}
          ج.م
          </p>

          <p>
          📷 ${images.length} صورة
          </p>

          ${p.badge ? `<p>${escapeHtml(p.badge)}</p>` : ""}

        </div>

        <button
          class="delete"
          onclick="deleteProduct(${p.id})">
          🗑️ حذف
        </button>

      </div>

      `;

    }).join("");

  }catch(e){

    box.innerHTML = "حدث خطأ في تحميل المنتجات.";

  }
}

function escapeHtml(text){

  return String(text).replace(/[&<>"']/g,m=>({

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"

  }[m]));

}

document.getElementById("productForm").onsubmit = async function(e){

  e.preventDefault();

  const message = document.getElementById("message");

  const formData = new FormData(this);

  const files = imageInput.files;

  if(files.length > 5){

    message.textContent = "❌ اختر 5 صور أو أقل.";

    return;
  }

  message.textContent = "جاري رفع المنتج والصور...";

  try{

    const res = await fetch("/api/products",{

      method:"POST",

      body:formData

    });

    const data = await res.json();

    if(!res.ok){

      message.textContent =
        data.error || "حدث خطأ.";

      return;
    }

    message.textContent =
      "✅ تم نشر المنتج بنجاح.";

    this.reset();

    preview.innerHTML = "";

    loadProducts();

  }catch(e){

    message.textContent =
      "❌ تعذر الاتصال بالسيرفر.";

  }

};

async function deleteProduct(id){

  if(!confirm("هل تريد حذف هذا المنتج؟"))
    return;

  const res = await fetch(
    "/api/products/" + id,
    {
      method:"DELETE"
    }
  );

  if(res.ok){

    loadProducts();

  }else{

    alert("حدث خطأ أثناء الحذف.");

  }

}

loadProducts();

</script>

</body>
</html>
